<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mint Gold Reserve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#032418',
                        gold: '#d4af37',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col">

    <!-- Simple Navigation (Reduced for Login Page) -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="flex items-center space-x-2">
                    <i class="fa-solid fa-coins text-gold text-3xl"></i>
                    <span class="font-bold text-2xl tracking-tight text-navy">Mint Gold Reserve</span>
                </a>
                <a href="index.html" class="text-sm text-gray-500 hover:text-gold transition">
                    &larr; Back to Store
                </a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border-t-4 border-gold">
            
            <!-- Header -->
            <div class="text-center">
                <i class="fa-solid fa-lock text-4xl text-navy mb-4"></i>
                <h2 class="text-3xl font-bold text-navy">Welcome Back</h2>
                <p class="mt-2 text-sm text-gray-600">
                    Secure access to your metals portfolio.
                </p>
            </div>
            
            <!-- Login Form -->
            <form class="mt-8 space-y-6" action="#" method="POST" onsubmit="event.preventDefault(); alert('Login successful! In production, this authenticates via WooCommerce.');">
                
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-gold focus:border-gold sm:text-sm" placeholder="john@example.com">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-gold focus:border-gold sm:text-sm" placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-navy focus:ring-gold border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                            Remember me
                        </label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-navy hover:text-gold transition">
                            Forgot your password?
                        </a>
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-navy hover:bg-gold hover:text-navy focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gold transition-colors duration-300">
                        Sign In
                    </button>
                </div>
            </form>
            
            <!-- Registration Link -->
            <div class="mt-6 text-center text-sm text-gray-600 border-t border-gray-200 pt-6">
                Don't have an account? 
                <a href="signup.html" class="font-medium text-navy hover:text-gold transition">Sign up here</a>.
            </div>
            
        </div>
    </div>

    <!-- Minimal Footer -->
    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-xs">
        <p>&copy; 2026 Mint Gold Reserve. All rights reserved.</p>
        <p class="mt-1">Secured by 256-bit encryption.</p>
    </footer>

    <script src="newsletter.js"></script>
</body>
</html>
