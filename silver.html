<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Bullion - John's Precious Metals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { navy: '#032418', gold: '#d4af37' } } } }
    </script>
    <style>
        .price-flash { animation: flashGreen 1s ease-out; }
        @keyframes flashGreen { 0% { background-color: rgba(34, 197, 94, 0.2); } 100% { background-color: transparent; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Live Market Ticker -->
    <div class="bg-navy text-white text-sm py-2 px-4 flex justify-between items-center overflow-hidden">
        <div class="flex space-x-6 whitespace-nowrap" id="ticker-bar"><span>Loading live markets...</span></div>
        <div class="text-xs text-gray-400 hidden sm:block"><i class="fa-solid fa-bolt text-yellow-400"></i> Powered by Upstate Coins API</div>
    </div>

    <!-- Navigation -->
<nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                
                <!-- Left Container: Logo -->
                <div class="flex-1 flex items-center justify-start space-x-2">
                    <i class="fa-solid fa-coins text-gold text-3xl"></i>
                    <a href="index.html" class="font-bold text-2xl tracking-tight text-navy">John's Metals</a>
                </div>
                
                <!-- Middle Container: Links -->
                <div class="flex-1 hidden md:flex justify-center space-x-5 whitespace-nowrap text-sm font-semibold text-gray-600">
                    <a href="gold.html" class="hover:text-gold transition">Gold</a>
                    <a href="silver.html" class="hover:text-gold transition">Silver</a>
                    <a href="platinum.html" class="hover:text-gold transition">Platinum</a>
                    <a href="deals.html" class="hover:text-gold transition">Deals</a>
                    <a href="subscription-boxes.html" class="hover:text-gold transition">Subscriptions</a>
                    <a href="blind-chase-boxes.html" class="hover:text-gold transition">Blind Boxes</a>
                    <a href="about.html" class="hover:text-gold transition">About</a>
                </div>
                
                <!-- Right Container: Icons -->
                <div class="flex-1 flex items-center justify-end space-x-4 text-navy">
                    <a href="login.html" class="hover:text-gold"><i class="fa-solid fa-user text-xl"></i></a>
                    <a href="checkout.html" class="hover:text-gold relative">
                        <i class="fa-solid fa-shopping-cart text-xl"></i>
                        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-4 w-4 flex items-center justify-center transition-transform duration-200">0</span>
                    </a>
                </div>
                
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="bg-navy py-12 border-t border-navy shadow-inner">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">Silver Bullion & Coins</h1>
            <p class="text-gray-300">Hedge against inflation with high-quality, pure silver assets.</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto px-4 py-12">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="category-grid">
            <!-- Products injected by JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        const categoryProducts = [
            { id: 301, name: "1 oz Silver American Eagle", metal: "silver", weightOz: 1, premium: 12.50, image: "https://imgs.search.brave.com/K_ZKa1PEtxvmiXL_R3j0EFfOuAX1o11Z9yCbJRGNXGA/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9zdGF0/aWMuam1idWxsaW9u/LmNvbS9pbWFnZS91/cGxvYWQvcV9hdXRv/LGZfYXV0byx3XzIw/MixoXzIwMi92MTc2/MTU3MjY3OC9TQ0FF/MTIxTl80X29idmVy/c2U" },
            { id: 302, name: "10 oz Silver Bar", metal: "silver", weightOz: 10, premium: 25.00, image: "https://imgs.search.brave.com/yKAfBH9gomRhPAOT-Sz-cIagEETDo8M5C0vJy4adhpE/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9idWxs/aW9udHJhZGluZ2xs/Yy5jb20vd3AtY29u/dGVudC91cGxvYWRz/LzIwMjYvMDEvMGNh/NTU0MzktOTIyMS00/ZjRiLWJkMmEtMjc0/OWVmYzkyZDliLmMw/ZjNkODhmMDljZDc1/NWRmNDNiZDZhMTcz/MjdlYWU2LTMwMHgz/MDAud2VicA" },
            { id: 303, name: "1 Kilo Silver Bar", metal: "silver", weightOz: 32.15, premium: 65.00, image: "https://imgs.search.brave.com/PPHHYLYUyshvdpKMfhMHCA8STwII-ZDvLG4LJHm7B_g/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9kdXJo/YW1wcmVjaW91c21l/dGFscy5iLWNkbi5u/ZXQvd3AtY29udGVu/dC91cGxvYWRzLzIw/MjEvMDUvVW50aXRs/ZWQtZGVzaWduLTYy/LndlYnA" },
            { id: 304, name: "Monster Box (500 Silver Eagles)", metal: "silver", weightOz: 500, premium: 4500.00, image: "https://imgs.search.brave.com/IRc7U9-qUTxP1EQMx7R88zffvRvdoCAigzgJSIWd3O4/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/Y29pbmd1aWRlLmNv/bS93cC1jb250ZW50/L3VwbG9hZHMvMjAy/NS8xMC8yMDI2LTUw/MC1jb2luLXNpbHZl/ci1lYWdsZS1tb25z/dGVyLWJveC0zMDB4/MzAwLmpwZw" }
        ];

        function renderCategory() {
            const grid = document.getElementById('category-grid');
            if (!grid) return;
            grid.innerHTML = ''; 
            categoryProducts.forEach(product => {
                const retailPrice = (spotPrices[product.metal] * product.weightOz) + product.premium;
                grid.innerHTML += `
                    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition duration-300 flex flex-col">
                        <div class="h-48 overflow-hidden bg-gray-200"><img src="${product.image}" class="w-full h-full object-cover"></div>
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <p class="text-xs text-gray-500 uppercase font-bold tracking-wider mb-1">${product.weightOz} oz ${product.metal}</p>
                                <h3 class="text-lg font-bold text-navy mb-2 leading-tight">${product.name}</h3>
                            </div>
                            <div class="mt-4 price-container rounded p-2 -mx-2 transition-colors duration-300">
                                <p class="text-2xl font-bold text-green-600">${formatMoney(retailPrice)}</p>
                            </div>
                            <button onclick="addToCart(${product.id}, '${product.name}', ${retailPrice}, ${product.premium})" class="mt-4 w-full bg-navy text-white font-semibold py-2 rounded hover:bg-gold transition duration-300">Add to Cart</button>
                        </div>
                    </div>`;
            });
        }

        function simulateMarketChanges() {
            spotPrices.gold *= (1 + (Math.random() * 0.002 - 0.001));
            spotPrices.silver *= (1 + (Math.random() * 0.004 - 0.002));
            spotPrices.platinum *= (1 + (Math.random() * 0.003 - 0.0015));
            renderTicker();
            renderCategory();
            document.querySelectorAll('.price-container').forEach(c => { c.classList.add('price-flash'); setTimeout(() => c.classList.remove('price-flash'), 1000); });
        }
        document.addEventListener('DOMContentLoaded', renderCategory);
    </script>
    <script src="newsletter.js"></script>
</body>
</html>
